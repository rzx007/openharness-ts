appId: app.openharness.desktop
productName: OpenHarness
directories:
  buildResources: resources
# 只带编译产物。node_modules 由 electron-builder 按 production dependencies 另收，
# 不要用默认 **/*，否则会扫整个 apps/desktop（含源码和构建工具）。
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/prebuilds/**
  - node_modules/node-pty/build/**
  - node_modules/node-pty/prebuilds/**
win:
  executableName: OpenHarness
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: OpenHarness
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/openharness/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
