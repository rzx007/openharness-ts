name: Tag Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.1)"
        required: true
        type: string

concurrency:
  group: tag-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate version and create tag
        id: prepare
        run: |
          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version: expected X.Y.Z format, received '${VERSION}'"
            exit 1
          fi
          node --input-type=module -e "import { parseReleaseTag } from './scripts/prepare-tag-release.mjs'; parseReleaseTag('${TAG}')"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Visual Studio Build Tools (Windows)
        if: matrix.target == 'win'
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync workspace versions to the tag
        run: node scripts/prepare-tag-release.mjs ${{ needs.validate.outputs.tag }}

      - name: Verify update packaging config
        run: pnpm --filter @openharness/desktop verify:update-packaging

      - name: Build workspace dependencies
        run: pnpm --filter @openharness/desktop^... build

      - name: Build Desktop
        run: pnpm --filter @openharness/desktop build

      - name: Package Windows
        if: matrix.target == 'win'
        run: pnpm --filter @openharness/desktop exec -- electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package Linux
        if: matrix.target == 'linux'
        run: pnpm --filter @openharness/desktop exec -- electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify updater artifacts
        run: pnpm --filter @openharness/desktop verify:update-packaging:artifact

      - name: Upload Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.exe.blockmap
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.AppImage.blockmap
            apps/desktop/dist/*.deb
            apps/desktop/dist/latest.yml
            apps/desktop/dist/latest-linux.yml
          if-no-files-found: error

  publish-npm:
    needs: [validate, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync workspace versions to the tag
        run: node scripts/prepare-tag-release.mjs ${{ needs.validate.outputs.tag }}

      - name: Build CLI
        run: pnpm --filter @rzx/ohs... build

      - name: Publish CLI if this version is new
        # Trusted Publishing (OIDC): do not set NODE_AUTH_TOKEN / NPM_TOKEN.
        # Provenance is generated automatically when publishing via OIDC.
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          if npm view "@rzx/ohs@${VERSION}" version >/dev/null 2>&1; then
            echo "@rzx/ohs@${VERSION} is already on npm; skipping publish."
          else
            pnpm --filter @rzx/ohs publish --access public --no-git-checks
          fi

  publish-release:
    needs: [validate, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          test -f release-assets/latest.yml
          test -f release-assets/latest-linux.yml
          test -n "$(ls release-assets/*.exe 2>/dev/null)"
          test -n "$(ls release-assets/*.AppImage 2>/dev/null)"
          test -n "$(ls release-assets/*.deb 2>/dev/null)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" release-assets/* \
              --verify-tag \
              --latest \
              --title "OpenHarness ${VERSION}" \
              --notes "$(cat <<EOF
          ## Desktop
          - Windows: \`OpenHarness-${VERSION}-setup.exe\`
          - Linux AppImage: \`OpenHarness-${VERSION}.AppImage\`
          - Linux deb: \`OpenHarness-${VERSION}.deb\`

          ## CLI
          \`\`\`bash
          npm install -g @rzx/ohs@${VERSION}
          \`\`\`
          EOF
          )"
          fi
